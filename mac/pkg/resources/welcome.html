<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  /* Transparent ground so Installer's own window (and the background artwork) shows
     through in both appearances; ink/paper text per docs/DESIGN.md, no hue. */
  :root { --text: #111111; --faint: #555555; }
  @media (prefers-color-scheme: dark) { :root { --text: #F2F2F2; --faint: #A3A3A3; } }
  body {
    margin: 0;
    padding: 22px 24px;
    background: transparent;
    color: var(--text);
    font: 13px/1.55 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 12px; }
  ol { margin: 4px 0 14px; padding-left: 20px; }
  li { margin: 0 0 6px; }
  .faint { color: var(--faint); font-size: 12px; }
  code { font: 12px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
  <h1>VibeHub for Mac</h1>
  <p>Your coding presence, right beside the notch.</p>
  <ol>
    <li>Installs VibeHub in <strong>/Applications</strong>.</li>
    <li>Opens it when done. Connect in your browser, then press <strong>Start Tracking</strong>.</li>
  </ol>
  <p class="faint">Nothing runs in the background until you press Start Tracking.</p>
</body>
</html>
